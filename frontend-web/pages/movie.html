<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Movie</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Manrope:wght@300;400;600&display=swap" rel="stylesheet"/>

  <link rel="stylesheet" href="../styles/base.css"/>
  <link rel="stylesheet" href="../styles/movie.css"/>
</head>

<nav class="top-links">
  <a href="../index.html">Movies</a>
  <a href="../pages/cinemas.html">Cinemas</a>
  <a href="../pages/recommendations.html">Recommendations</a>
</nav>

<body class="app-bg">
  <header class="app-topbar">
    <div class="container d-flex align-items-center justify-content-between">
      <a href="../index.html" class="brand text-decoration-none">Ticket Shop</a>
      <div class="search-wrap">
        <input id="search-input" class="search-input" type="text" placeholder="Search movies"/>
        <button id="search-btn" class="search-btn"><span class="search-icon"></span></button>
      </div>
      <div class="profile-icon"></div>
    </div>
  </header>

  <main class="container app-main">
    <div class="movie-hero card-surface">
      <div class="movie-poster-placeholder"></div>
      <div class="movie-hero-body">
        <h2 id="movie-title" class="movie-title">Movie Title</h2>
        <p id="movie-desc" class="movie-desc">Movie description</p>
        <div class="movie-meta">
          <div class="meta-pill" id="movie-genre">Genre</div>
          <div class="meta-pill" id="movie-duration">Duration</div>
          <div class="meta-pill" id="movie-rating">Rating</div>
        </div>
      </div>
    </div>

    <div class="sessions-block">
      <h3 class="section-title">Session Time</h3>
      <div id="sessions-grid" class="sessions-grid">
        <!-- TODO: render session buttons -->
      </div>
    </div>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/shared/dom.js"></script>
  <script src="../js/shared/format.js"></script>
  <script src="../js/state.js"></script>
  <script src="../js/ui/movie.js"></script>
</body>
</html>
