<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Checkout</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Manrope:wght@300;400;600&display=swap" rel="stylesheet"/>

  <link rel="stylesheet" href="../styles/base.css"/>
  <link rel="stylesheet" href="../styles/checkout.css"/>
</head>

<nav class="top-links">
  <a href="../index.html">Movies</a>
  <a href="../pages/cinemas.html">Cinemas</a>
  <a href="../pages/recommendations.html">Recommendations</a>
</nav>

<body class="app-bg">
  <main class="container app-main">
    <div class="checkout-card card-surface">
      <h3 class="section-title">Checkout</h3>

      <form id="checkout-form" class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Customer Name</label>
          <input id="customer-name" class="form-control" type="text" placeholder="Full name"/>
        </div>
        <div class="col-md-6">
          <label class="form-label">Customer Email</label>
          <input id="customer-email" class="form-control" type="email" placeholder="name@mail.com"/>
        </div>

        <div class="col-12">
          <button id="btn-pay" class="btn btn-success btn-lg" type="submit">
            Buy Tickets
          </button>
        </div>
      </form>

      <div id="checkout-status" class="checkout-status muted"></div>
    </div>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/shared/dom.js"></script>
  <script src="../js/shared/format.js"></script>
  <script src="../js/state.js"></script>
  <script src="../js/ui/checkout.js"></script>
</body>
</html>
