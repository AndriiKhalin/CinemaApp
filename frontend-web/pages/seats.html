<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Seats</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Manrope:wght@300;400;600&display=swap" rel="stylesheet"/>

  <link rel="stylesheet" href="../styles/base.css"/>
  <link rel="stylesheet" href="../styles/seats.css"/>
</head>

<nav class="top-links">
  <a href="../index.html">Movies</a>
  <a href="../pages/cinemas.html">Cinemas</a>
  <a href="../pages/recommendations.html">Recommendations</a>
</nav>

<body class="app-bg">
  <main class="container app-main">
    <div class="seats-header text-center">
      <h2 class="page-title">Seat Selection</h2>
      <div class="seats-subtitle">
        <span id="seats-movie-title">Movie Title</span> ·
        <span id="seats-session-time">DD Month YYYY, 00:00</span>
      </div>
    </div>

    <div class="seats-legend">
      <div class="legend-item"><span class="legend-box free"></span>Available</div>
      <div class="legend-item"><span class="legend-box booked"></span>Booked</div>
      <div class="legend-item"><span class="legend-box selected"></span>Selected</div>
    </div>

    <div class="screen-pill">SCREEN</div>

    <div id="seats-grid" class="seats-grid">
      <!-- TODO: render seat buttons -->
    </div>

    <div class="checkout-panel card-surface">
      <div>
        <div class="muted">Selected seats:</div>
        <div id="selected-seats-text" class="selected-seats">Row 0 Seat 0</div>
      </div>
      <div class="text-end">
        <div class="muted">Total:</div>
        <div id="total-price" class="total-price">0 UAH</div>
      </div>
      <a id="btn-checkout" class="btn btn-primary btn-lg disabled" href="checkout.html">
        Continue
      </a>
    </div>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/shared/dom.js"></script>
  <script src="../js/shared/format.js"></script>
  <script src="../js/state.js"></script>
  <script src="../js/ui/seats.js"></script>
</body>
</html>
